# Build settings for build.py. See DEFAULT_CONFIG there for fallbacks used
# when a key is missing, and for the full set of recognized keys.

# Justify note description paragraphs.
justify = false

# Centre note titles and subtitles (false = left-aligned).
center_title = false

# Body font stack.
font = 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace'

# Max-width of the index note grid.
grid_width = "40rem"

# Viewport width below which the grid becomes a single-column list.
list_breakpoint = "30rem"

# Gemini text model for animate/: writes the storyboard and plans `just edit` changes.
# Any Gemini model ID works; prices per 1M tokens (input / output), Oct 2026:
#   gemini-3.1-flash-lite   $0.25 / $1.50   cheapest; loose with rules
#   gemini-3.5-flash-lite   $0.30 / $2.50
#   gemini-3.6-flash        $0.75 / $3.75   older than 3.8, same price
#   gemini-3.8-flash        $0.75 / $3.75   good balance (price doubles 1 Jan 2027)
#   gemini-3.1-pro-preview  $2 / $12        preview; may change or be retired
#   gemini-4-argon          $2 / $10        best quality, slowest (price doubles 1 Dec 2026)
text_model = "gemini-4-argon"

# Gemini image model that draws every frame (1K, 9:16). Per image at 1K, Oct 2026:
#   gemini-nano-banana-2.1       $0.0336 out + $1.50/1M in  made for multiple reference images (default)
#   gemini-3.1-flash-lite-image  $0.0336 out + $0.25/1M in  cheapest; Google: "isn't optimized for
#                                                           multiple reference inputs"
#   gemini-3.1-flash-image       $0.067 out + $0.50/1M in
# With ~5 reference images a frame, 2.1 comes to roughly $0.045 a frame, Lite ~$0.036.
image_model = "gemini-nano-banana-2.1"

# Gemini model that checks each frame against the references and its scene (pass/fail per check);
# failed frames are redrawn. ~$0.002 a frame on flash-lite.
judge_model = "gemini-3.1-flash-lite"
